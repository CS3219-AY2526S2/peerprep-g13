<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Collaboration Service Test</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #ddd; }
    h2 { color: #61dafb; }
    textarea {
      width: 100%; height: 300px; background: #252526; color: #d4d4d4;
      border: 1px solid #555; padding: 10px; font-size: 14px;
      font-family: monospace; resize: vertical; box-sizing: border-box;
    }
    #status { margin: 8px 0; font-size: 13px; }
    .connected { color: #4ec9b0; }
    .disconnected { color: #f48771; }
    #log { font-size: 11px; color: #888; margin-top: 8px; height: 80px; overflow-y: auto; background: #111; padding: 6px; }
    label { font-size: 12px; color: #888; }
  </style>
  <!-- No import map: import everything from esm.sh so they share one yjs instance -->
</head>
<body>
  <h2>Collaboration Service — WebSocket Test</h2>
  <div id="status" class="disconnected">Connecting...</div>
  <label>Room ID: <span id="room-display"></span></label>
  <br><br>
  <label>Shared code editor — open a second tab at the same URL to see live sync:</label>
  <br>
  <textarea id="editor" placeholder="Type here..."></textarea>
  <div id="log"></div>

  <script type="module">
    // Import both from the same esm.sh bundle so they share one yjs instance
    import * as Y from 'https://esm.sh/yjs@13.6.20';
    import { WebsocketProvider } from 'https://esm.sh/y-websocket@2.1.0?deps=yjs@13.6.20';

    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += `[${new Date().toISOString().slice(11,19)}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
    }

    const params = new URLSearchParams(location.search);
    const roomId = params.get('roomId') || 'test-room-1';
    const token  = params.get('token')  || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ0ZXN0QGV4YW1wbGUuY29tIiwiaWF0IjoxNzc0NTUwNTA4LCJleHAiOjE3NzcxNDI1MDh9.ejVR-Y0Gnwzxg6aq4saBW7BVAWv82nv-WOysqRvCdc4';

    document.getElementById('room-display').textContent = roomId;
    log(`Connecting to room: ${roomId}`);

    const ydoc = new Y.Doc();
    const ytext = ydoc.getText('code');

    // y-websocket sends: ws://localhost:4000/<roomId>?token=...
    const provider = new WebsocketProvider('ws://localhost:4000', roomId, ydoc, {
      params: { token }
    });

    const statusEl = document.getElementById('status');
    provider.on('status', ({ status }) => {
      log(`Status: ${status}`);
      statusEl.textContent = `Status: ${status}  |  Room: ${roomId}`;
      statusEl.className = status === 'connected' ? 'connected' : 'disconnected';
    });

    provider.on('connection-error', (err) => log(`Connection error: ${err}`));
    provider.on('connection-close', (e) => log(`Closed: code=${e.code} reason=${e.reason}`));

    const textarea = document.getElementById('editor');

    // Yjs → textarea
    ytext.observe(() => {
      const newVal = ytext.toString();
      if (textarea.value !== newVal) {
        const s = { start: textarea.selectionStart, end: textarea.selectionEnd };
        textarea.value = newVal;
        textarea.setSelectionRange(s.start, s.end);
      }
    });

    // textarea → Yjs (diff-based)
    textarea.addEventListener('input', () => {
      const newVal = textarea.value;
      const oldVal = ytext.toString();
      if (newVal === oldVal) return;
      let s = 0;
      while (s < oldVal.length && s < newVal.length && oldVal[s] === newVal[s]) s++;
      let eo = oldVal.length, en = newVal.length;
      while (eo > s && en > s && oldVal[eo - 1] === newVal[en - 1]) { eo--; en--; }
      ydoc.transact(() => {
        if (eo > s) ytext.delete(s, eo - s);
        if (en > s) ytext.insert(s, newVal.slice(s, en));
      });
    });

    log('Script loaded, waiting for connection...');
  </script>
</body>
</html>
