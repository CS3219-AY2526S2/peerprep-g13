spring.application.name=server
spring.datasource.url=jdbc:postgresql://localhost:5432/peerprep
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.flyway.enabled=false

server.port=8080
cors.allowed-origins=http://localhost:5173,http://localhost:5174

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.redis.host=localhost
spring.redis.port=6379

rabbitmq.queue.name=peerprep-queue
rabbitmq.exchange.name=peerprep-exchange
rabbitmq.routing.key=peerprep-routing-key