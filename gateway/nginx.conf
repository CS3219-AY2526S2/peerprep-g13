server {
    listen 8090;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    location = /_auth {
        internal;
        proxy_pass http://user-service:8080/user/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }

    location /user/auth/register {
        include /etc/nginx/cors_preflight.conf;
        include /etc/nginx/cors_headers.conf;

        proxy_pass http://user-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /user/auth/login {
        include /etc/nginx/cors_preflight.conf;
        include /etc/nginx/cors_headers.conf;

        proxy_pass http://user-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /user/auth {
        include /etc/nginx/cors_preflight.conf;
        include /etc/nginx/cors_headers.conf;

        proxy_pass http://user-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location /user/ {
        include /etc/nginx/cors_preflight.conf;

        auth_request /_auth;

        auth_request_set $x_user_id $upstream_http_x_user_id;
        auth_request_set $x_user_role $upstream_http_x_user_role;
        auth_request_set $x_user_email $upstream_http_x_user_email;

        proxy_set_header X-User-Id $x_user_id;
        proxy_set_header X-User-Role $x_user_role;
        proxy_set_header X-User-Email $x_user_email;

        include /etc/nginx/cors_headers.conf;

        proxy_pass http://user-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /questions {
        include /etc/nginx/cors_preflight.conf;

        auth_request /_auth;

        auth_request_set $x_user_id $upstream_http_x_user_id;
        auth_request_set $x_user_role $upstream_http_x_user_role;
        auth_request_set $x_user_email $upstream_http_x_user_email;

        proxy_set_header X-User-Id $x_user_id;
        proxy_set_header X-User-Role $x_user_role;
        proxy_set_header X-User-Email $x_user_email;

        include /etc/nginx/cors_headers.conf;

        proxy_pass http://question-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /questions/ {
        include /etc/nginx/cors_preflight.conf;

        auth_request /_auth;

        auth_request_set $x_user_id $upstream_http_x_user_id;
        auth_request_set $x_user_role $upstream_http_x_user_role;
        auth_request_set $x_user_email $upstream_http_x_user_email;

        proxy_set_header X-User-Id $x_user_id;
        proxy_set_header X-User-Role $x_user_role;
        proxy_set_header X-User-Email $x_user_email;

        include /etc/nginx/cors_headers.conf;

        proxy_pass http://question-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /match/ {
        include /etc/nginx/cors_preflight.conf;

        auth_request /_auth;
        auth_request_set $x_user_id $upstream_http_x_user_id;
        auth_request_set $x_user_role $upstream_http_x_user_role;
        auth_request_set $x_user_email $upstream_http_x_user_email;
        proxy_set_header X-User-Id $x_user_id;
        proxy_set_header X-User-Role $x_user_role;
        proxy_set_header X-User-Email $x_user_email;
        include /etc/nginx/cors_headers.conf;
        proxy_pass http://matching-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        proxy_pass http://matching-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /collab/ {
        proxy_pass http://collaboration-service:4000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 8090;
    return 301 https://$host$request_uri;
}