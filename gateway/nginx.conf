server {
    listen 8090;

    # ── Strip upstream CORS headers server-wide ───────────────────────────────
    # Upstream services set their own CORS headers via Spring Security.
    # nginx also adds CORS headers via add_header. Without these directives the
    # browser receives the header twice and blocks the request.
    # Applies to every proxied location in this server block.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Expose-Headers;

    # ── Internal auth subrequest ──────────────────────────────────────────────
    # nginx forwards the original Authorization header to user-service:/user/auth.
    # A 2xx reply means the token is valid; 401/403 is returned to the client
    # immediately and the upstream is never reached.
    location = /_auth {
        internal;
        proxy_pass              http://user-service:8080/user/auth;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length  "";
        proxy_set_header        X-Original-URI  $request_uri;
        proxy_set_header        Host            $host;
        proxy_set_header        Authorization   $http_authorization;
    }

    # ── Public: user auth (register / login — no token required) ─────────────
    location /user/auth/register {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Max-Age'       86400 always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin'  'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        proxy_pass http://user-service:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /user/auth/login {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Max-Age'       86400 always;
            return 204;
        }
        add_header 'Access-Control-Allow-Origin'  'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
        proxy_pass http://user-service:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    

    # ── Protected: all other /user/ routes ───────────────────────────────────
    location /user/ {
        # Preflight bypass — OPTIONS never carries an Authorization header so
        # auth_request would always return 401. Return 204 here; the if block
        # fires in the rewrite phase, before auth_request (access phase).
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Max-Age'       86400 always;
            return 204;
        }

        auth_request /_auth;

        # Propagate identity headers returned by user-service to the upstream
        auth_request_set $x_user_id    $upstream_http_x_user_id;
        auth_request_set $x_user_role  $upstream_http_x_user_role;
        auth_request_set $x_user_email $upstream_http_x_user_email;

        proxy_set_header X-User-Id    $x_user_id;
        proxy_set_header X-User-Role  $x_user_role;
        proxy_set_header X-User-Email $x_user_email;

        # Always attach CORS headers so the browser can read 401/403 bodies too
        add_header 'Access-Control-Allow-Origin'  'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        proxy_pass http://user-service:8080;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Protected: question-service ──────────────────────────────────────────
    location /questions {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Max-Age'       86400 always;
            return 204;
        }

        auth_request /_auth;

        auth_request_set $x_user_id    $upstream_http_x_user_id;
        auth_request_set $x_user_role  $upstream_http_x_user_role;
        auth_request_set $x_user_email $upstream_http_x_user_email;

        proxy_set_header X-User-Id    $x_user_id;
        proxy_set_header X-User-Role  $x_user_role;
        proxy_set_header X-User-Email $x_user_email;

        add_header 'Access-Control-Allow-Origin'  'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        proxy_pass http://question-service:8081;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /questions/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Max-Age'       86400 always;
            return 204;
        }

        auth_request /_auth;

        auth_request_set $x_user_id    $upstream_http_x_user_id;
        auth_request_set $x_user_role  $upstream_http_x_user_role;
        auth_request_set $x_user_email $upstream_http_x_user_email;

        proxy_set_header X-User-Id    $x_user_id;
        proxy_set_header X-User-Role  $x_user_role;
        proxy_set_header X-User-Email $x_user_email;

        add_header 'Access-Control-Allow-Origin'  'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        proxy_pass http://question-service:8081;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Protected: matching-service HTTP ─────────────────────────────────────
    location /match/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  'http://localhost:5173' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;
            add_header 'Access-Control-Max-Age'       86400 always;
            return 204;
        }

        auth_request /_auth;

        auth_request_set $x_user_id    $upstream_http_x_user_id;
        auth_request_set $x_user_role  $upstream_http_x_user_role;
        auth_request_set $x_user_email $upstream_http_x_user_email;

        proxy_set_header X-User-Id    $x_user_id;
        proxy_set_header X-User-Role  $x_user_role;
        proxy_set_header X-User-Email $x_user_email;

        add_header 'Access-Control-Allow-Origin'  'http://localhost:5173' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        proxy_pass http://matching-service:8082;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Public: matching-service WebSocket (STOMP/SockJS) ────────────────────
    # Auth is handled inside matching-service via the STOMP CONNECT frame.
    location /ws {
        proxy_pass http://matching-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Upgrade         $http_upgrade;
        proxy_set_header Connection      "upgrade";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Public: collaboration-service WebSocket ───────────────────────────────
    # Auth is handled inside collaboration-service via JWT query param.
    # Strip the /collab prefix so the service sees /<roomId>?token=...
    location /collab/ {
        proxy_pass http://collaboration-service:4000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade         $http_upgrade;
        proxy_set_header Connection      "upgrade";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
