name: CI — gateway

on:
  push:
    branches: [main, branch-D3, branch-D4]
    paths:
      - "gateway/**"
      - ".github/workflows/ci-gateway.yml"
  pull_request:
    branches: [main, branch-D3, branch-D4]
    paths:
      - "gateway/**"
      - ".github/workflows/ci-gateway.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/peerprep-gateway

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/branch-D3' || github.ref == 'refs/heads/branch-D4' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}