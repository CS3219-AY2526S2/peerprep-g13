name: CI — client

on:
  push:
    branches: [main, branch-D3, branch-D4]
    paths:
      - "client/**"
      - "gateway/**"
      - ".github/workflows/ci-client.yml"
  pull_request:
    branches: [main, branch-D3, branch-D4]
    paths:
      - "client/**"
      - "gateway/**"
      - ".github/workflows/ci-client.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/peerprep-client

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        env:
          VITE_API_BASE_URL: http://localhost:8090
          VITE_MATCHING_API_BASE_URL: http://localhost:8090
          VITE_COLLAB_SERVICE_WS_URL: ws://localhost:4000
        run: npm run build

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/branch-D3' || github.ref == 'refs/heads/branch-D4' }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=http://47.129.119.71:8090
            VITE_MATCHING_API_BASE_URL=http://47.129.119.71:8090
            VITE_COLLAB_SERVICE_WS_URL=ws://47.129.119.71:8090/collab