name: CD — Deploy to AWS EC2

on:
  workflow_run:
    workflows:
      - "CI — client"
      - "CI — user-service"
      - "CI — question-service"
      - "CI — matching-service"
      - "CI — collaboration-service"
      - "CI — gateway"
    branches: [branch-D4, main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          timeout:  120s
          script: |
            set -e
            cd /home/ubuntu/peerprep

            echo "${{ secrets.PAT_TOKEN }}" | \
              docker login ghcr.io -u "cs3219-ay2526s2" --password-stdin

            export GITHUB_REPO_OWNER=cs3219-ay2526s2

            docker compose -f docker-compose.prod.yml pull

            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker image prune -f

            echo "Deploy completed at $(date)"